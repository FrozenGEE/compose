# 官方文档
# https://hub.docker.com/r/smanx/deepseek-harness

# https://visovala-dsh.hf.space
# 演示网页，账号密码均为 admin

# DSH：容器内安装官方 npm 包 @deepseek-ai/dsh（deepseek-harness），默认监听容器内 127.0.0.1:3079（源端口）；
# Node 代理：0.0.0.0:3080（代理端口）→ 127.0.0.1:3079，对外提供 HTTP + WebSocket 转发；
# 为什么需要代理：
# DSH 官方禁止 --host 0.0.0.0（安全限制），只能监听回环地址；
# 局域网 IP 页面属于浏览器非安全上下文，DSH 前端依赖的 crypto.randomUUID 不可用，代理在转发 HTML 时自动注入基于 getRandomValues 的 polyfill，否则实时通道（WS）会一直 pending；
# 代理同时提供可选的 HTTP Basic Auth，给局域网访问加认证。

---
version: "3"
# 最后编辑时间：2026-08-18
services:
  deepseek-harness:
    image: smanx/deepseek-harness:latest
    # 镜像地址，默认使用latest，其余tag如下
    # latest，精简运行镜像，无（仅 Node 运行时 + DSH + 反向代理）
    # devtools-min-latest，精简工具版，常用调试工具	git、curl、wget、nano、jq、procps、ca-certificates、unzip
    # devtools-latest，完整工具版，可在容器内开发/编译	精简版全部 + vim、openssh-client、zip、htop、tmux、tree、openssl、python3、build-essential(make+g++)、bash-completion
    container_name: deepseek-harness
    # 容器名字
    hostname: deepseek-harness
    # 主机名
    volumes:
      - ./deepseek-harness:/root/.dsh
      # 配置文件目录
      # - 【这里替换为你的NAS目录】:【这里替换为你的NAS目录】
      # 映射NAS本地目录，使其可以访问到NAS里的东西，具体可以直接去问：让你访问我的NAS本地目录你可以做些什么
    environment:
      - DSH_PORT=3079
      # 源端口，DSH 在容器内监听（127.0.0.1），默认为3079，不动
      - PROXY_PORT=3080
      # 代理端口：代理对外监听（局域网入口），默认3080，不动
      # DSH_PORT 与 PROXY_PORT 必须不同（同一端口只能被一个进程监听）。 修改 PROXY_PORT 时，-p 端口映射要对应改成 -p <宿主机端口>:<新代理端口>

      # - PROXY_USERNAME=admin
      # - PROXY_PASSWORD=admin
      # 基本认证用户名和密码（可选），默认预设均为 admin
      - TZ=Asia/Shanghai
      # 时区
      
    # network_mode: bridge
    network_mode: host
    # host模式需要容器内的端口不被占用，不需要端口映射，后续端口映射全都开头加#注释掉，否则注释掉这条
    ports:
      - 3080:3080
      # WebUI 端口
    restart: unless-stopped
    # 重启策略，可根据实际情况而选择 no/always/unless-stopped/on-failure/on-failure:3
